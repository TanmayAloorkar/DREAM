name: Pipeline test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: true

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.6"

      - name: Run pipeline on simulated test data
        run: nextflow run pipeline/main.nf -profile test -ansi-log false

      - name: Check counts match the simulation
        run: python tests/check_counts.py results/test
