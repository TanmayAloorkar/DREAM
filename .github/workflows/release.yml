name: Release

# Pushing a tag such as v0.1.0 builds the desktop app and publishes
# DREAM-<tag>-linux-x86_64.tar.gz (whole project plus Run_Dream) as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # pinned, not ubuntu-latest: the binary needs the glibc of the build system, and 24.04 (glibc 2.39) covers Mint 22 and newer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test and build the desktop app
        working-directory: gui
        run: cargo test --locked && cargo build --release --locked

      - name: Package the release archive
        run: scripts/package_release.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DREAM $GITHUB_REF_NAME" --generate-notes
